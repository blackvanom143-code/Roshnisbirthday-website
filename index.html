<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mio's Birthday 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow-x:hidden;
background:#ffc0cb;
}

.page{
display:none; /* Changed default from absolute to hidden to stop page overlapping */
width:100%;
min-height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;
padding: 20px;
}

/* Show the first page initially */
#countdownPage {
display: flex;
}

/* HEARTS */

.heart{
position:absolute;
font-size:30px;
animation:floatHeart linear infinite;
opacity:0.7;
pointer-events:none;
z-index:1;
}

@keyframes floatHeart{

0%{
transform:translateY(120vh);
opacity:0;
}

100%{
transform:translateY(-120vh);
opacity:1;
}

}

/* PAGE 1 */

#countdownPage{
background:#ffc0cb;
color:white;
text-align:center;
}

.main-title{
font-size:65px;
font-weight:700;
margin-bottom:20px;
text-shadow:0 0 20px hotpink;
}

.subtitle{
font-size:24px;
margin-bottom:40px;
}

.countdown{
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
}

.box{
width:150px;
height:150px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
border-radius:30px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
box-shadow:0 0 35px rgba(255,255,255,0.5);
}

.box h1{
font-size:55px;
}

.box p{
font-size:20px;
}

#openBtn,
#playQuizBtn,
.downloadBtn,
#nextBlankPageBtn,
#surpriseBtn,
#memoryBtn{

margin-top:30px;
padding:18px 40px;
border:none;
border-radius:50px;
background:#ff2e74;
color:white;
font-size:22px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px hotpink;
z-index: 100;
}

/* PAGE 2 */

#galleryPage{
background:black;
overflow:hidden;
height:100vh;
}

.gallery-title{
position:absolute;
top:40px;
left:50%;
transform:translateX(-50%);
font-size:65px;
color:#ff69b4;
text-shadow:0 0 25px hotpink;
z-index:10;
}

.balloon{
position:absolute;
bottom:-400px;
width:220px;
height:220px;
animation:flyUp linear infinite;
}

.balloon img{
width:100%;
height:100%;
object-fit:contain;
border-radius:30px;
border:5px solid white;
}

.balloon::before{
content:"🎈";
position:absolute;
top:-60px;
left:50%;
transform:translateX(-50%);
font-size:60px;
}

@keyframes flyUp{

0%{
transform:translateY(0);
}

100%{
transform:translateY(-180vh);
}

}

.b1{left:2%; animation-duration:11s;}
.b2{left:27%; animation-duration:13s;}
.b3{left:52%; animation-duration:12s;}
.b4{left:77%; animation-duration:14s;}

/* RULES PAGE */

#rulesPage{
background:#ffc7d8;
}

.rules-box,
.question-card,
.love-letter-box,
.secret-box{

background:rgba(255,255,255,0.25);
backdrop-filter:blur(10px);
padding:45px;
border-radius:35px;
width:90%;
max-width:850px;
text-align:center;
}

.rules-title,
.love-title,
.secret-title{
font-size:55px;
color:white;
margin-bottom:30px;
}

.rules-list{
list-style:none;
font-size:24px;
line-height:2;
color:white;
}

/* QUIZ PAGE */

#quizPage{
background:#ffc7d8;
}

.kiss-counter{
font-size:30px;
font-weight:bold;
color:#ff2e74;
margin-bottom:30px;
}

.question-card h2{
font-size:34px;
color:white;
margin-bottom:30px;
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.answer-btn{
padding:18px;
border:none;
border-radius:20px;
font-size:20px;
font-weight:bold;
background:white;
color:#ff2e74;
cursor:pointer;
}
