<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mio's Birthday 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow-x:hidden;
background:#ffc0cb;
width:100%;
min-height:100vh;
}

/* FIX: Staged layers so hidden pages completely disappear and don't block clicks */
.page{
display:none;
width:100%;
min-height:100vh;
flex-direction:column;
justify-content:center;
align-items:center;
overflow:hidden;
padding:20px;
position:relative;
z-index:2;
}

/* Force first page visible initially */
#countdownPage {
display:flex;
}

/* FLOATING HEARTS BACKGROUND */
#heartsContainer {
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:1;
overflow:hidden;
}

.heart{
position:absolute;
font-size:30px;
animation:floatHeart linear infinite;
opacity:0.7;
pointer-events:none;
}

@keyframes floatHeart{
0%{ transform:translateY(105vh); opacity:0; }
100%{ transform:translateY(-105vh); opacity:1; }
}

/* PAGE 1 */
#countdownPage{
background:#ffc0cb;
color:white;
text-align:center;
}

.main-title{
font-size:50px;
font-weight:700;
margin-bottom:20px;
text-shadow:0 0 20px hotpink;
}

.subtitle{
font-size:20px;
margin-bottom:40px;
}

.countdown{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
}

.box{
width:120px;
height:120px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
border-radius:25px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
box-shadow:0 0 25px rgba(255,255,255,0.3);
}

.box h1{ font-size:40px; }
.box p{ font-size:16px; }

#openBtn,
#playQuizBtn,
.downloadBtn,
#nextBlankPageBtn,
#surpriseBtn,
#memoryBtn{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:50px;
background:#ff2e74;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 25px hotpink;
z-index:10;
position:relative;
}

/* PAGE 2 */
#galleryPage{
background:black;
min-height:100vh;
}

.gallery-title{
margin-bottom:40px;
font-size:45px;
color:#ff69b4;
text-shadow:0 0 25px hotpink;
text-align:center;
}

.balloon-grid {
display:flex;
flex-wrap:wrap;
gap:30px;
justify-content:center;
align-items:center;
width:100%;
max-width:1000px;
margin-bottom:30px;
}

.balloon{
width:180px;
height:180px;
position:relative;
}

.balloon img{
width:100%;
height:100%;
object-fit:cover;
border-radius:25px;
border:4px solid white;
}

/* RULES, QUIZ, LETTER, SECRET BOXES */
.rules-box,
.question-card,
.love-letter-box,
.secret-box{
background:rgba(255,255,255,0.25);
backdrop-filter:blur(10px);
padding:35px;
border-radius:30px;
width:100%;
max-width:750px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.rules-title,
.love-title,
.secret-title{
font-size:40px;
color:white;
margin-bottom:25px;
}

.rules-list{
list-style:none;
font-size:20px;
line-height:1.8;
color:white;
text-align:left;
margin-bottom:20px;
}

/* QUIZ PAGE */
.kiss-counter{
font-size:26px;
font-weight:bold;
color:#ff2e74;
margin-bottom:25px;
background:white;
padding:10px 20px;
border-radius:30px;
display:inline-block;
}

.question-card h2{
font-size:26px;
color:white;
margin-bottom:25px;
}

.answers{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.answer-btn{
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
background:white;
color:#ff2e74;
cursor:pointer;
transition:all 0.2s ease;
}

/* COUPON */
#couponPopup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
transition:0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
z-index:9999;
text-align:center;
}

#couponPopup.show{
transform:translate(-50%,-50%) scale(1);
}

.coupon-card{
width:320px;
height:150px;
background:#ffd6e2;
border-radius:20px;
display:flex;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.coupon-left,
.coupon-right{
